<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R&J Advisory | The Trading Floor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <style>
    body {
      cursor: none;
    }
    #bg-chart-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
    }
    #crosshair-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    #crosshair-h, #crosshair-v {
      position: absolute;
      background: rgba(200, 162, 74, 0.07);
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #crosshair-h {
      width: 100%;
      height: 1px;
      left: 0;
    }
    #crosshair-v {
      width: 1px;
      height: 100%;
      top: 0;
    }
    #cursor-dot {
      position: fixed;
      width: 9px;
      height: 9px;
      background: rgba(200, 162, 74, 0.9);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: opacity 0.15s ease, width 0.15s ease, height 0.15s ease;
    }
    #root {
      position: relative;
      z-index: 1;
    }
  </style>
  <body class="font-sans antialiased text-white">
    <canvas id="bg-chart-canvas"></canvas>
    <div id="crosshair-overlay">
      <div id="crosshair-h"></div>
      <div id="crosshair-v"></div>
    </div>
    <div id="cursor-dot"></div>
    <div id="root"></div>
    <script>
      const h = document.getElementById('crosshair-h');
      const v = document.getElementById('crosshair-v');
      const dot = document.getElementById('cursor-dot');
      
      document.addEventListener('mousemove', (e) => {
        h.style.top = e.clientY + 'px';
        v.style.left = e.clientX + 'px';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
      });
      
      document.body.addEventListener('mouseleave', () => {
        h.style.opacity = '0';
        v.style.opacity = '0';
        dot.style.opacity = '0';
      });
      
      document.body.addEventListener('mouseenter', () => {
        h.style.opacity = '1';
        v.style.opacity = '1';
        dot.style.opacity = '1';
      });
      
      document.addEventListener('mouseover', (e) => {
        if (e.target.closest('a, button, input, select, textarea')) {
          dot.style.width = '14px';
          dot.style.height = '14px';
        }
      });
      
      document.addEventListener('mouseout', (e) => {
        if (e.target.closest('a, button, input, select, textarea')) {
          dot.style.width = '9px';
          dot.style.height = '9px';
        }
      });

      const canvas = document.getElementById('bg-chart-canvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const timeLabels = ['09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30'];

      function drawChart() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        ctx.clearRect(0, 0, width, height);

        const gridSize = 80;
        const cols = Math.ceil(width / gridSize);
        const rows = Math.ceil(height / gridSize);

        // Draw Grid Lines Horizontal and Vertical
        ctx.save();
        ctx.beginPath();
        for (let r = 0; r <= rows; r++) {
          const y = r * gridSize;
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        for (let c = 0; c <= cols; c++) {
          const x = c * gridSize;
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        ctx.strokeStyle = 'rgba(200, 162, 74, 0.04)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();

        // Draw Moving Average Sine Wave
        ctx.save();
        ctx.beginPath();
        for (let x = 0; x <= width; x += 5) {
          const y = (height / 2) + Math.sin(x / 180) * (height / 6);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(200, 162, 74, 0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        // Draw Price Labels
        ctx.save();
        ctx.font = '9px JetBrains Mono, monospace';
        ctx.fillStyle = 'rgba(200, 162, 74, 0.07)';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        let priceValue = 1420;
        for (let r = rows; r >= 0; r--) {
            const seed = (r * 17) % 97;
            ctx.fillText(priceValue.toString(), width - 48, r * gridSize);
            priceValue += 8 + (seed % 17);
        }
        ctx.restore();

        // Draw Time Labels
        ctx.save();
        ctx.font = '9px JetBrains Mono, monospace';
        ctx.fillStyle = 'rgba(200, 162, 74, 0.07)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        for (let c = 0; c <= cols; c++) {
          const timeLabel = timeLabels[c % timeLabels.length];
          ctx.fillText(timeLabel, c * gridSize, height - 16);
        }
        ctx.restore();
      }

      window.addEventListener('resize', drawChart);
      drawChart();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
